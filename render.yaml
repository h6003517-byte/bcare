# render.yaml
# https://render.com/docs/yaml-spec

services:
  # Main Static Site (Phishing Pages - what users see)
  - type: web
    name: bcare-site
    runtime: static
    region: oregon
    plan: free
    buildCommand: npx -y pnpm@9 install --no-frozen-lockfile && npx -y pnpm@9 --filter phishing-pages build
    staticPublishPath: artifacts/phishing-pages/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Admin Dashboard
  - type: web
    name: bcare-dashboard
    runtime: static
    region: oregon
    plan: free
    buildCommand: npx -y pnpm@9 install --no-frozen-lockfile && npx -y pnpm@9 --filter mockup-sandbox build
    staticPublishPath: artifacts/mockup-sandbox/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # API Server
  - type: web
    name: api-server
    runtime: node
    region: oregon
    plan: free
    nodeVersion: "24"
    buildCommand: npx -y pnpm@9 install --no-frozen-lockfile && npx -y pnpm@9 --filter api-server build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"