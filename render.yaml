# render.yaml
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: api-server
    runtime: node
    region: oregon
    plan: free
    nodeVersion: "24"
    buildCommand: npx -y pnpm@9 install --no-frozen-lockfile && npx -y pnpm@9 --filter api-server build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false