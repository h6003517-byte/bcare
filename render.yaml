# render.yaml
# https://render.com/docs/yaml-spec

services:
  # Frontend Static Site
  - type: web
    name: bcare-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npx -y pnpm@9 install --no-frozen-lockfile && npx -y pnpm@9 --filter mockup-sandbox build
    staticPublishPath: artifacts/mockup-sandbox/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # API Server
  - type: web
    name: api-server
    runtime: node
    region: oregon
    plan: free
    nodeVersion: "24"
    buildCommand: npx -y pnpm@9 install --no-frozen-lockfile && npx -y pnpm@9 --filter api-server build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - fromService:
          name: bcare-frontend
          envVarKey: FRONTEND_URL
          type: reference